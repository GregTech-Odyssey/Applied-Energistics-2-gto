    side="CLIENT"

[[dependencies.ae2]]
    modId="theoneprobe"
    mandatory=false
    versionRange="${top_version}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.ae2]]
    modId="jade"
    mandatory=false
    versionRange="${jade_version}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.ae2]]
    modId="emi"
    mandatory=true
    versionRange="[1.1.26,)"
    ordering="AFTER"
    side="BOTH"

[[mods]]
modId="ae2wtlib"
version="15.3.3-gto"
displayName="AE2WTLib (Merged into AE2 GTO)"
