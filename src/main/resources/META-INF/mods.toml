modLoader="javafml"
loaderVersion="[44,)"
#updateJSONURL=""
issueTrackerURL="https://github.com/GregTech-Odyssey/GregTech-Odyssey/issues"
displayURL="https://github.com/GregTech-Odyssey/Applied-Energistics-2-gto"
logoFile="logo.png"
#credits="Thanks for this example mod goes to Java"
authors="TeamAppliedEnergistics"
license="See GitHub repository for details"

[[mods]]
modId="ae2"
version="0.0.0"
displayName="Applied Energistics 2"
description="A Mod about Matter, Energy and using them to conquer the world.."

[[dependencies.ae2]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version}"
    ordering="NONE"
    side="BOTH"

[[dependencies.ae2]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version}"
    ordering="NONE"
    side="BOTH"

[[dependencies.ae2]]
    modId="guideme"
    mandatory=true
    versionRange="${guideme_version}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.ae2]]
    modId="jei"
    mandatory=false
    versionRange="${jei_version}"
    # All mods in this jar share one Forge sorting node. Bundled EMI must load before JEI.
    ordering="NONE"
    side="CLIENT"

[[dependencies.ae2]]
    modId="theoneprobe"
    mandatory=false
    versionRange="${top_version}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.ae2]]
    modId="jade"
    mandatory=false
    versionRange="${jade_version}"
    ordering="AFTER"
    side="BOTH"

# EMI is shipped by this fork; keep its mod identity for existing plugins.
[[mods]]
modId="emi"
version="1.1.24-crazer.1"
displayName="EMI"
authors="Emi, Crazerium"
credits="EMI by Emi (emilyploszaj); EMI fork enhancements by Crazerium; MIT License (LICENSE-EMI)."
description="Item and recipe viewer included with the GTO AE fork."

[[dependencies.emi]]
modId="ae2"
mandatory=true
versionRange="[15.2610.18,)"
ordering="NONE"
side="BOTH"

[[dependencies.emi]]
modId="jei"
mandatory=false
versionRange="${jei_version}"
ordering="BEFORE"
side="CLIENT"

# EMI Trades is bundled; preserve its identity and reject duplicate standalone jars.
[[mods]]
modId="emitrades"
version="1.2.1-gto.1"
displayName="EMI Trades"
authors="Prismwork, Flamarine"
credits="Original EMI Trades by Prismwork and Flamarine; MIT License (LICENSE-EMITrades). Adapted by GregTech Odyssey."
description="Villager and wandering trader recipes for the bundled EMI."

[[dependencies.emitrades]]
modId="emi"
mandatory=true
versionRange="[1.0,)"
ordering="NONE"
side="CLIENT"
